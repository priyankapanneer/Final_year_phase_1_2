<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Access Management | AcadGraph</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: #090d16;
        color: #f8fafc;
        min-height: 100vh;
        padding: 24px 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        background: #111827;
        padding: 16px 24px;
        border-radius: 12px;
        border: 1px solid #1f2937;
      }
      .nav a {
        color: #94a3b8;
        text-decoration: none;
        margin-left: 18px;
        font-weight: 500;
        font-size: 14px;
        transition: color 0.2s;
      }
      .nav a:hover, .nav a.active {
        color: #38bdf8;
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }
      h1 {
        font-size: 26px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .btn-primary {
        background: linear-gradient(135deg, #0284c7, #4f46e5);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .card {
        background: #111827;
        border-radius: 14px;
        border: 1px solid #1f2937;
        padding: 24px;
        margin-bottom: 25px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th {
        text-align: left;
        color: #94a3b8;
        font-size: 13px;
        padding: 12px 14px;
        border-bottom: 1px solid #1f2937;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      td {
        padding: 14px;
        border-bottom: 1px solid #1f2937;
        font-size: 14px;
      }
      .role-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        display: inline-block;
      }
      .role-super { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }
      .role-admin { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
      .role-faculty { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
      .role-student { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
      .btn-del {
        background: transparent;
        border: 1px solid #ef4444;
        color: #f87171;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .btn-del:hover {
        background: #ef4444;
        color: white;
      }
      /* Modal */
      .modal-bg {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal {
        background: #111827;
        border: 1px solid #374151;
        border-radius: 14px;
        width: 100%;
        max-width: 480px;
        padding: 30px;
      }
      .modal h2 {
        font-size: 20px;
        color: #38bdf8;
        margin-bottom: 16px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #cbd5e1;
        margin-bottom: 6px;
      }
      input, select {
        width: 100%;
        background: #090d16;
        border: 1px solid #374151;
        color: white;
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      input:focus, select:focus {
        border-color: #38bdf8;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }
      .btn-cancel {
        background: #1f2937;
        border: 1px solid #374151;
        color: #cbd5e1;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <div style="font-weight: 700; font-size: 18px; color: #f8fafc;">
          🌐 AcadGraph <span style="font-size: 12px; background: #3b82f6; padding: 2px 8px; border-radius: 10px; margin-left: 6px;">Admin Console</span>
        </div>
        <div>
          <a href="/">Dashboard</a>
          <a href="/chat">AI Copilot</a>
          <a href="/upload">Document Studio</a>
          <a href="/graph">Graph Explorer</a>
          <a href="/admin/users" class="active">Users</a>
          <a href="/admin/universities">Universities</a>
          <a href="/login" style="color: #f87171;" onclick="localStorage.clear()">Sign Out</a>
        </div>
      </div>

      <div class="header-row">
        <div>
          <h1>User Access & Role Management</h1>
          <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">Manage students, faculty members, and academic admins with RBAC control.</p>
        </div>
        <button class="btn-primary" onclick="openModal()">+ Add New User</button>
      </div>

      <div class="card">
        <table id="usersTable">
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Email / ID</th>
              <th>Assigned Role</th>
              <th>University Tenant</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h2>Add Academic User</h2>
        <form id="addUserForm" onsubmit="handleCreateUser(event)">
          <div class="form-group">
            <label for="uName">Full Name</label>
            <input type="text" id="uName" placeholder="e.g. Dr. Ramesh Babu" required />
          </div>
          <div class="form-group">
            <label for="uEmail">Email / Academic ID</label>
            <input type="email" id="uEmail" placeholder="e.g. ramesh@annauniv.edu" required />
          </div>
          <div class="form-group">
            <label for="uPass">Temporary Password</label>
            <input type="password" id="uPass" placeholder="••••••••" required />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label for="uRole">Role</label>
              <select id="uRole">
                <option value="STUDENT">Student</option>
                <option value="FACULTY">Faculty</option>
                <option value="UNIVERSITY_ADMIN">University Admin</option>
              </select>
            </div>
            <div class="form-group">
              <label for="uTenant">University</label>
              <select id="uTenant">
                <option value="UNI_ANNA">Anna University</option>
                <option value="UNI_IITM">IIT Madras</option>
                <option value="UNI_SRM">SRM Institute</option>
              </select>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save User</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function openModal() {
        document.getElementById('modalBg').style.display = 'flex';
      }
      function closeModal() {
        document.getElementById('modalBg').style.display = 'none';
      }

      async function fetchUsers() {
        try {
          const res = await fetch('/api/admin/users');
          const users = await res.json();
          const tbody = document.getElementById('usersTbody');
          tbody.innerHTML = '';

          users.forEach(u => {
            const tr = document.createElement('tr');
            let roleClass = 'role-student';
            if (u.role === 'SUPER_ADMIN') roleClass = 'role-super';
            else if (u.role === 'UNIVERSITY_ADMIN') roleClass = 'role-admin';
            else if (u.role === 'FACULTY') roleClass = 'role-faculty';

            tr.innerHTML = `
              <td><strong>${u.name}</strong></td>
              <td>${u.username}</td>
              <td><span class="role-badge ${roleClass}">${u.role}</span></td>
              <td>${u.university_id}</td>
              <td>
                ${u.role !== 'SUPER_ADMIN' ? `<button class="btn-del" onclick="deleteUser('${u.username}')">Remove</button>` : '<span style="color: #64748b; font-size: 12px;">Protected</span>'}
              </td>
            `;
            tbody.appendChild(tr);
          });
        } catch (err) {
          console.error(err);
        }
      }

      async function handleCreateUser(e) {
        e.preventDefault();
        const name = document.getElementById('uName').value.trim();
        const username = document.getElementById('uEmail').value.trim();
        const password = document.getElementById('uPass').value.trim();
        const role = document.getElementById('uRole').value;
        const university_id = document.getElementById('uTenant').value;

        try {
          const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password, role, university_id })
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || 'Failed to add user');
          }
          closeModal();
          document.getElementById('addUserForm').reset();
          fetchUsers();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }

      async function deleteUser(username) {
        if (!confirm(`Are you sure you want to remove user '${username}'?`)) return;
        try {
          const res = await fetch(`/api/admin/users/${encodeURIComponent(username)}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('Failed to delete user');
          fetchUsers();
        } catch (err) {
          alert(err.message);
        }
      }

      fetchUsers();
    </script>
  </body>
</html>
