<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | AcadGraph</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: radial-gradient(circle at 50% 20%, #1e293b, #090d16 80%);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
      }
      .card {
        background: #111827;
        border: 1px solid #374151;
        border-radius: 16px;
        width: 100%;
        max-width: 500px;
        padding: 40px 32px;
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
      }
      .brand-title {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 6px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brand-subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 6px;
      }
      input, select {
        width: 100%;
        background: #0b0f19;
        border: 1px solid #374151;
        color: white;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      input:focus, select:focus {
        border-color: #38bdf8;
      }
      .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, #0284c7, #4f46e5);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 15px;
      }
      .btn-submit:hover {
        opacity: 0.95;
      }
      .error-box {
        display: none;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid #ef4444;
        color: #fca5a5;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 18px;
      }
      .footer-links {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #94a3b8;
      }
      .footer-links a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand-title">Create AcadGraph Account</div>
      <div class="brand-subtitle">Join your university's Academic Knowledge Graph</div>

      <div id="errorBox" class="error-box"></div>

      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="e.g. S. Meenakshi" required />
        </div>

        <div class="form-group">
          <label for="username">Academic Email</label>
          <input type="email" id="username" placeholder="e.g. meenakshi@annauniv.edu" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role">
              <option value="STUDENT">Student</option>
              <option value="FACULTY">Faculty / Professor</option>
            </select>
          </div>

          <div class="form-group">
            <label for="university">University</label>
            <select id="university">
              <option value="UNI_ANNA">Anna University</option>
              <option value="UNI_IITM">IIT Madras</option>
              <option value="UNI_SRM">SRM Institute</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Complete Registration</button>
      </form>

      <div class="footer-links">
        Already registered? <a href="/login">Sign in</a>
      </div>
    </div>

    <script>
      async function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;
        const university_id = document.getElementById('university').value;
        const errBox = document.getElementById('errorBox');
        const btn = document.getElementById('submitBtn');

        errBox.style.display = 'none';
        btn.innerText = 'Creating account...';
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password, role, university_id })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Registration failed');
          }

          localStorage.setItem('acadgraph_token', data.access_token);
          localStorage.setItem('acadgraph_user', JSON.stringify(data.user));
          window.location.href = '/';
        } catch (err) {
          errBox.innerText = err.message;
          errBox.style.display = 'block';
        } finally {
          btn.innerText = 'Complete Registration';
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
