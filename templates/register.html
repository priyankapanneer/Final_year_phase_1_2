<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | AcadGraph</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: #000000;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #0a0a0a;
        border: 1px solid #262626;
        border-radius: 12px;
        width: 100%;
        max-width: 460px;
        padding: 40px 32px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
      }
      .brand-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        text-align: center;
        margin-bottom: 6px;
      }
      .brand-subtitle {
        text-align: center;
        color: #737373;
        font-size: 13px;
        margin-bottom: 25px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #a3a3a3;
        margin-bottom: 6px;
      }
      input, select {
        width: 100%;
        background: #141414;
        border: 1px solid #262626;
        color: #ffffff;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      input:focus, select:focus {
        border-color: #ffffff;
      }
      .btn-submit {
        width: 100%;
        background: #ffffff;
        color: #000000;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 15px;
      }
      .btn-submit:hover {
        opacity: 0.9;
      }
      .error-box {
        display: none;
        background: #171717;
        border: 1px solid #525252;
        color: #ffffff;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 18px;
      }
      .footer-links {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #737373;
      }
      .footer-links a {
        color: #ffffff;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand-title">Create Account</div>
      <div class="brand-subtitle">Join your university's knowledge network</div>

      <div id="errorBox" class="error-box"></div>

      <form id="regForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Dr. S. Meenakshi" required />
        </div>

        <div class="form-group">
          <label for="username">Academic Email</label>
          <input type="email" id="username" placeholder="meenakshi@annauniv.edu" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role">
              <option value="STUDENT">Student</option>
              <option value="FACULTY">Faculty</option>
            </select>
          </div>

          <div class="form-group">
            <label for="university">University</label>
            <select id="university">
              <option value="UNI_ANNA">Anna University</option>
              <option value="UNI_IITM">IIT Madras</option>
              <option value="UNI_SRM">SRM Institute</option>
              <option value="UNI_MIT">MIT Campus</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Complete Registration</button>
      </form>

      <div class="footer-links">
        Already registered? <a href="/login">Sign in</a>
      </div>
    </div>

    <script>
      async function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;
        const university_id = document.getElementById('university').value;
        const errBox = document.getElementById('errorBox');
        const btn = document.getElementById('submitBtn');

        errBox.style.display = 'none';
        btn.innerText = 'Creating account...';
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password, role, university_id })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Registration failed');
          }

          localStorage.setItem('acadgraph_token', data.access_token);
          localStorage.setItem('acadgraph_user', JSON.stringify(data.user));
          window.location.href = '/';
        } catch (err) {
          errBox.innerText = err.message;
          errBox.style.display = 'block';
        } finally {
          btn.innerText = 'Complete Registration';
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
