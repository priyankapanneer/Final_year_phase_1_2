<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | AcadGraph Enterprise</title>
    <link rel="stylesheet" href="/static/css/premium.css" />
    <style>
      body {
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .register-container {
        width: 100%;
        max-width: 480px;
      }
      .register-card {
        background: var(--bg-surface);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-card);
        border-radius: var(--radius-lg);
        padding: 36px 32px;
        box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .register-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.5) 50%, transparent 100%);
      }
      .brand-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .logo-icon-large {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
        color: #000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.25);
      }
      .brand-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .brand-subtitle {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .error-box {
        display: none;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-left: 3px solid #ef4444;
        color: #fca5a5;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        margin-bottom: 18px;
      }
      .grid-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .footer-links {
        text-align: center;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--border-subtle);
        font-size: 13px;
        color: var(--text-secondary);
      }
      .footer-links a {
        color: #ffffff;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: var(--transition);
      }
      .footer-links a:hover {
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="brand-header">
          <div class="logo-icon-large">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <h1 class="brand-title">Create Account</h1>
          <p class="brand-subtitle">Join your university's knowledge network and graph intelligence</p>
        </div>

        <div id="errorBox" class="error-box"></div>

        <form id="regForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Dr. S. Meenakshi" required />
          </div>

          <div class="form-group">
            <label for="username">Academic Email</label>
            <input type="email" id="username" placeholder="meenakshi@annauniv.edu" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>

          <div class="grid-2col">
            <div class="form-group">
              <label for="role">Role</label>
              <select id="role">
                <option value="STUDENT">Student</option>
                <option value="FACULTY">Faculty</option>
              </select>
            </div>

            <div class="form-group">
              <label for="university">University</label>
              <select id="university">
                <option value="UNI_ANNA">Anna University</option>
                <option value="UNI_IITM">IIT Madras</option>
                <option value="UNI_SRM">SRM Institute</option>
                <option value="UNI_MIT">MIT Campus</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn" style="width: 100%; height: 44px; margin-top: 10px;">
            <span>Complete Registration</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </form>

        <div class="footer-links">
          Already registered? <a href="/login">Sign In to Workspace</a>
        </div>
      </div>
    </div>

    <script>
      async function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;
        const university_id = document.getElementById('university').value;
        const errBox = document.getElementById('errorBox');
        const btn = document.getElementById('submitBtn');

        errBox.style.display = 'none';
        btn.innerHTML = '<span>Creating account...</span>';
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password, role, university_id })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Registration failed');
          }

          localStorage.setItem('acadgraph_token', data.access_token);
          localStorage.setItem('acadgraph_user', JSON.stringify(data.user));
          window.location.href = '/';
        } catch (err) {
          errBox.innerText = err.message;
          errBox.style.display = 'block';
        } finally {
          btn.innerHTML = '<span>Complete Registration</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>';
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
