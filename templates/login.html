<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | AcadGraph</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: #000000;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        background: #0a0a0a;
        border: 1px solid #262626;
        border-radius: 12px;
        width: 100%;
        max-width: 440px;
        padding: 40px 32px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
      }
      .brand-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        text-align: center;
        margin-bottom: 6px;
      }
      .brand-subtitle {
        text-align: center;
        color: #737373;
        font-size: 13px;
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #a3a3a3;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        background: #141414;
        border: 1px solid #262626;
        color: #ffffff;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus {
        border-color: #ffffff;
      }
      .btn-submit {
        width: 100%;
        background: #ffffff;
        color: #000000;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
        margin-top: 10px;
      }
      .btn-submit:hover {
        opacity: 0.9;
      }
      .error-box {
        display: none;
        background: #171717;
        border: 1px solid #525252;
        color: #ffffff;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 18px;
      }
      .quick-demo-section {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #262626;
      }
      .quick-demo-title {
        font-size: 11px;
        color: #737373;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        margin-bottom: 12px;
        text-align: center;
      }
      .demo-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .demo-btn {
        background: #121212;
        border: 1px solid #262626;
        color: #a3a3a3;
        padding: 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
      }
      .demo-btn:hover {
        border-color: #ffffff;
        color: #ffffff;
        background: #1a1a1a;
      }
      .demo-role {
        font-size: 10px;
        font-weight: 700;
        display: block;
        color: #ffffff;
        margin-bottom: 2px;
      }
      .footer-links {
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: #737373;
      }
      .footer-links a {
        color: #ffffff;
        text-decoration: underline;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand-title">AcadGraph</div>
      <div class="brand-subtitle">Academic Knowledge Graph Intelligence</div>

      <div id="errorBox" class="error-box"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Academic Email</label>
          <input type="text" id="username" placeholder="faculty.kumar@annauniv.edu" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
      </form>

      <div class="quick-demo-section">
        <div class="quick-demo-title">1-Click Demo Accounts</div>
        <div class="demo-grid">
          <button class="demo-btn" onclick="fillLogin('faculty.kumar@annauniv.edu', 'kumar123')">
            <span class="demo-role">FACULTY</span>
            Dr. Kumar
          </button>
          <button class="demo-btn" onclick="fillLogin('student.ravi@annauniv.edu', 'ravi123')">
            <span class="demo-role">STUDENT</span>
            Ravi S
          </button>
          <button class="demo-btn" onclick="fillLogin('admin@annauniv.edu', 'anna123')">
            <span class="demo-role">DEAN / ADMIN</span>
            Anna Univ
          </button>
          <button class="demo-btn" onclick="fillLogin('superadmin@acadgraph.io', 'admin123')">
            <span class="demo-role">SUPER ADMIN</span>
            Platform Owner
          </button>
        </div>
      </div>

      <div class="footer-links">
        Need an account? <a href="/register">Register</a>
      </div>
    </div>

    <script>
      function fillLogin(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }

      async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errBox = document.getElementById('errorBox');
        const btn = document.getElementById('submitBtn');

        errBox.style.display = 'none';
        btn.innerText = 'Signing in...';
        btn.disabled = true;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Invalid credentials');
          }

          localStorage.setItem('acadgraph_token', data.access_token);
          localStorage.setItem('acadgraph_user', JSON.stringify(data.user));
          window.location.href = '/';
        } catch (err) {
          errBox.innerText = err.message;
          errBox.style.display = 'block';
        } finally {
          btn.innerText = 'Sign In';
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
